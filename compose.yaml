services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot schema creation from the legacy SQL scripts (plus db/init supplements). Exits 0 and does
  # nothing when the Attendance database already exists in the mssql-data volume.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}
      DB_SERVER: sqlserver
      DB_NAME: Attendance
      DB_SEED_SAMPLE_DATA: "true"
    volumes:
      - ./AttendanceSystem/Database:/legacy:ro
      - ./db/init:/db-init:ro
    entrypoint: ["/bin/bash", "/db-init/init-db.sh"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port defaults to 8080; set API_PORT in .env if 8080 is taken on the host.
      - "${API_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=Attendance;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

volumes:
  mssql-data:
